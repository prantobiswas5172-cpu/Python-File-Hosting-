version: '3.8'

services:
  bot:
    build: .
    container_name: cloudhost_bot
    restart: always
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # Essential for controlling host Docker
      - ./projects:/app/projects
      - ./backups:/app/backups
      - ./hosting.db:/app/hosting.db
    network_mode: host